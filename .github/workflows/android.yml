name: Android

on:
  push:
    branches: ["**"]
    paths:
      - "android/**"
      - "handheld_forge/distros.json"
      - "handheld_forge/labs.json"
      - "handheld_forge/keys/**"
      # The desktop app's drives get the same checks (the drive-images job).
      - "handheld_forge/*.py"
      - "tests/export_drive_images.py"
      - ".github/workflows/android.yml"
    tags:
      - "android-v*"
  pull_request:
    paths:
      - "android/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and APKs
        working-directory: android
        env:
          HF_KEYSTORE_B64: ${{ secrets.HF_KEYSTORE_B64 }}
          HF_KEYSTORE_PASSWORD: ${{ secrets.HF_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$HF_KEYSTORE_B64" ]; then
            echo "$HF_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            export HF_KEYSTORE_FILE="$RUNNER_TEMP/release.p12"
            echo "Signing with the release key from secrets"
          else
            unset HF_KEYSTORE_PASSWORD
            echo "Signing with the shared test key"
          fi
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease \
            2>&1 | tee build.log; status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then ci/annotate.sh build.log; exit $status; fi
      - name: Unit test failures
        if: failure()
        run: |
          for f in android/app/build/test-results/testDebugUnitTest/*.xml; do
            [ -f "$f" ] && python3 tests/junit_annotate.py "$f" || true
          done
      - name: Name the APK
        run: |
          v=$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts)
          cp android/app/build/outputs/apk/release/app-release.apk "HandheldForge-$v.apk"
          echo "APK=HandheldForge-$v.apk" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            ${{ env.APK }}
            android/app/build/outputs/apk/debug/app-debug.apk
  screens:
    # Boots an emulator, opens every screen (debug builds accept a demo extra),
    # screenshots them and fails on any crash.
    # Twice: Android 14, and Android 16 (the API level the app targets).
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        api: [34, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug 2>&1 | tail -5
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: android/ci/screens.sh && android/ci/picker.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-screens-${{ matrix.api }}
          path: screens/
          if-no-files-found: ignore


  drive-images:
    # Format drive and Ventoy, checked against the real tools: fsck.exfat, the kernel's exFAT
    # driver, Ventoy's own Ventoy2Disk.sh (byte for byte), and booting both in QEMU. Once with the
    # Android app's drives and once with the desktop app's, so both apps pass the same checks.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        maker: [android, desktop]
    name: drive-images (${{ matrix.maker }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        if: matrix.maker == 'android'
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        if: matrix.maker == 'android'
      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y exfatprogs exfat-fuse qemu-system-x86 ovmf socat imagemagick python3-pil grub-pc-bin grub-efi-amd64-bin grub-common mtools xorriso tesseract-ocr zip xz-utils dosfstools
          sudo apt-get install -y "linux-modules-extra-$(uname -r)" || true
          sudo modprobe exfat && echo "kernel exFAT driver loaded" || echo "no kernel exFAT driver; using exfat-fuse"
      - name: Latest Ventoy release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir vt && cd vt
          gh release download -R ventoy/Ventoy --pattern '*-linux.tar.gz' --pattern sha256.txt
          tar=$(ls ventoy-*-linux.tar.gz)
          grep " $tar\$" sha256.txt | sha256sum -c -
          tar xzf "$tar"
          echo "VTTAR=$PWD/$tar" >> "$GITHUB_ENV"
          echo "VTDIR=$PWD/$(ls -d ventoy-*/ | head -1)" >> "$GITHUB_ENV"
          echo "Ventoy: $tar"
      - name: Test ISOs for the importer (one plain, one .xz, one .bz2, one .zip)
        run: |
          mkdir -p iso/boot/grub imports
          # Prints to the screen and to the serial port, so CI can tell it booted whatever the video mode.
          printf '%s\n' 'set timeout=1' 'insmod serial' 'serial --unit=0 --speed=115200' 'terminal_output --append serial' \
            'menuentry "Forge test" { echo "Booted Forge test ISO"; sleep 600 }' > iso/boot/grub/grub.cfg
          grub-mkrescue -o forge-test.iso iso
          cp forge-test.iso imports/forge-test.iso
          xz -T0 -c forge-test.iso > imports/forge-packed.iso.xz
          bzip2 -9 -c forge-test.iso > imports/forge-bz.iso.bz2
          cp forge-test.iso forge-zip.iso && zip -j imports/forge-zip.zip forge-zip.iso && rm forge-zip.iso
          ls -l imports
      - name: Valve's real SteamOS image unpacks the same with the app's parallel bzip2 decoder
        if: matrix.maker == 'android'
        working-directory: android
        run: |
          curl -fsSL --retry 3 -o /tmp/steamos.img.bz2 https://steamdeck-images.steamos.cloud/recovery/steamdeck-repair-latest.img.bz2
          ls -l /tmp/steamos.img.bz2
          want=$(bzip2 -dc /tmp/steamos.img.bz2 | sha256sum | cut -d' ' -f1)
          echo "bzip2 -dc: $want"
          HF_BZ2_FILE=/tmp/steamos.img.bz2 HF_BZ2_SHA256="$want" ./gradlew --no-daemon :app:testDebugUnitTest --tests '*ParallelBzip2Test.realFileMatchesBzip2' --rerun-tasks 2>&1 | tail -5
          test -s /tmp/bz2-result.txt && echo "::notice title=SteamOS image, parallel bzip2::$(cat /tmp/bz2-result.txt)" && grep -q "^match" /tmp/bz2-result.txt
          rm -f /tmp/steamos.img.bz2
      - name: Valve's real SteamOS image unpacks the same with the desktop app's parallel bzip2 decoder
        if: matrix.maker == 'desktop'
        run: |
          curl -fsSL --retry 3 -o /tmp/steamos.img.bz2 https://steamdeck-images.steamos.cloud/recovery/steamdeck-repair-latest.img.bz2
          want=$(bzip2 -dc /tmp/steamos.img.bz2 | sha256sum | cut -d' ' -f1)
          echo "bzip2 -dc: $want"
          python3 - "$want" <<'PY'
          import hashlib, io, os, sys, time
          from handheld_forge.pbzip2 import ParallelBz2Reader
          t, h, n = time.monotonic(), hashlib.sha256(), 0
          with open("/tmp/steamos.img.bz2", "rb") as raw:
              r = ParallelBz2Reader(raw)
              f = io.BufferedReader(r, 1 << 20)
              while b := f.read(4 << 20):
                  h.update(b); n += len(b)
          secs = time.monotonic() - t
          ok = h.hexdigest() == sys.argv[1]
          msg = (f"{'match' if ok else 'MISMATCH'}: {n / 1e9:.2f} GB in {secs:.0f} s "
                 f"({n / 1e6 / secs:.0f} MB/s, {os.cpu_count()} cores, {r.joins} joins)")
          print(f"::notice title=SteamOS image, desktop parallel bzip2::{msg}")
          sys.exit(0 if ok else 1)
          PY
          rm -f /tmp/steamos.img.bz2
      - name: Make the desktop app's drives (same five)
        if: matrix.maker == 'desktop'
        run: |
          sudo env PYTHONPATH="$PWD" python3 tests/export_drive_images.py "$GITHUB_WORKSPACE/img" 16777216 "$VTTAR" "$GITHUB_WORKSPACE/imports"
          sudo chown -R "$USER" "$GITHUB_WORKSPACE/img"
          ls -ls "$GITHUB_WORKSPACE/img"
          for f in plain ventoy ventoy-nosb ventoy-import ventoy-bootnext; do test -s "$GITHUB_WORKSPACE/img/$f.img"; done
      - name: Make the app's drives (Format, Ventoy, Ventoy without Secure Boot, Ventoy with imported images, boot next)
        if: matrix.maker == 'android'
        working-directory: android
        env:
          HF_IMAGE_OUT: ${{ github.workspace }}/img
          HF_IMAGE_SECTORS: "16777216"
          HF_IMPORT_DIR: ${{ github.workspace }}/imports
        run: |
          export HF_VENTOY_TAR="$VTTAR"
          ./gradlew --no-daemon :app:testDebugUnitTest --tests '*VentoyTest.exportImagesForCi' --rerun-tasks 2>&1 | tail -5
          ls -ls "$HF_IMAGE_OUT"
          for f in plain ventoy ventoy-nosb ventoy-import ventoy-bootnext; do test -s "$HF_IMAGE_OUT/$f.img"; done
      - name: Check them with the real tools
        env:
          IMG: ${{ github.workspace }}/img
          SECTORS: "16777216"
        run: android/ci/drive-images.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drive-images-screens-${{ matrix.maker }}
          path: screens/
          if-no-files-found: ignore

  release:
    # Publishes when main carries a versionName that has no release yet,
    # so bumping versionName in android/app/build.gradle.kts is what ships a build.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/android-v')
    needs: [build, screens, drive-images]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk
      - name: Publish release if this version is new
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts)
          tag="android-v$v"
          if gh release view "$tag" -R "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $tag already exists, nothing to publish"
            exit 0
          fi
          gh release create "$tag" "HandheldForge-$v.apk" -R "${{ github.repository }}" --target "$GITHUB_SHA" \
            --title "Handheld Forge for Android $v" \
            --notes "Install the APK on an Android phone, plug in a USB drive with a USB-C adapter, and create a Bazzite, SteamOS or CachyOS boot drive. Keep the app open and the phone alone until it finishes. Signed with the shared test key."
